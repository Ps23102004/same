name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libs for opencv
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: CPU torch first, so the project doesn't pull the CUDA build
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e . pytest
      # Model-free tests only. The DINOv2 selfcheck and eval.py need the weights;
      # run them locally: python -m backend.app.retrieval.selfcheck
      - run: python -m pytest -q tests
