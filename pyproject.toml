[project]
name = "same"
version = "0.1.0"
description = "Find every photo a specific object has ever appeared in, entirely on-device."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.3",
    "transformers>=4.42",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "opencv-python>=4.10",
    "pillow>=10.3",
    "numpy>=1.26,<2",
    "hnswlib>=0.8",
    "pydantic>=2.7",
    "piexif>=1.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
